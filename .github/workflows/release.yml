name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  # PART 3 #22 — required to emit SLSA build-provenance attestations for assets.
  id-token: write
  attestations: write

# Supply-chain hardening (PART 3 #22):
#   * npm ci (not npm install) for a reproducible, lockfile-pinned install.
#   * SHA-256 checksums (SHA256SUMS.txt) published with the release.
#   * SPDX SBOM generated for the released tree.
#   * SLSA build-provenance attestation over every published asset.
# NOTE: third-party actions below still use floating major tags. For maximum
# tamper-resistance, pin each `uses:` to a full 40-char commit SHA (e.g.
# `actions/checkout@<sha>  # v4.2.2`) once you can verify the digests.

jobs:
  release:
    name: Build and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Base VSIX ──────────────────────────────────────────────────────
      - name: Install base extension dependencies
        working-directory: lineagelens-base-extension
        # npm ci installs exactly from package-lock.json (reproducible) and fails
        # if the lockfile is out of sync — unlike `npm install` (PART 3 #22).
        run: npm ci

      - name: Sync base extension version to tag
        working-directory: lineagelens-base-extension
        run: npm version --no-git-tag-version "${{ steps.version.outputs.VERSION }}" || true

      - name: Build base extension
        working-directory: lineagelens-base-extension
        run: npm run build

      - name: Package Base VSIX
        working-directory: lineagelens-base-extension
        run: |
          mkdir -p ../lineagelens-releases/base
          npx @vscode/vsce package \
            --no-dependencies \
            --allow-missing-repository \
            --out "../lineagelens-releases/base/lineagelens-base-${{ steps.version.outputs.VERSION }}.vsix"

      # ── Lite bundle ────────────────────────────────────────────────────
      - name: Bundle Lite
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TMPDIR="$(mktemp -d)"
          BUNDLE="${TMPDIR}/lineagelens-lite-${VERSION}"
          mkdir -p "${BUNDLE}/lineagelens-backend" \
                   "${BUNDLE}/lineagelens-proxy" \
                   "${BUNDLE}/lineagelens-deploy" \
                   "${BUNDLE}/lineagelens-docs"
          mkdir -p lineagelens-releases/lite

          # Backend
          cp -r lineagelens-backend/. "${BUNDLE}/lineagelens-backend/"
          find "${BUNDLE}/lineagelens-backend" -type d -name "__pycache__" -print0 | xargs -0 rm -rf 2>/dev/null || true
          find "${BUNDLE}/lineagelens-backend" -type d -name ".pytest_cache" -print0 | xargs -0 rm -rf 2>/dev/null || true
          find "${BUNDLE}/lineagelens-backend" -name ".env" -delete
          find "${BUNDLE}/lineagelens-backend" -name "*.env" -delete

          # Proxy (compose uses local build context)
          cp -r lineagelens-proxy/. "${BUNDLE}/lineagelens-proxy/"
          find "${BUNDLE}/lineagelens-proxy" -type d -name "__pycache__" -print0 | xargs -0 rm -rf 2>/dev/null || true

          # Deploy
          cp lineagelens-deploy/docker-compose.lite.yml "${BUNDLE}/lineagelens-deploy/"
          cp lineagelens-deploy/.env.lite.example       "${BUNDLE}/lineagelens-deploy/.env.example"

          # Docs
          cp lineagelens-docs/architecture.md         "${BUNDLE}/lineagelens-docs/"
          cp lineagelens-docs/lightweight-adapters.md "${BUNDLE}/lineagelens-docs/"
          cp lineagelens-docs/shipping-modes.md       "${BUNDLE}/lineagelens-docs/"

          # README and scripts
          cp README.md                               "${BUNDLE}/README.md"
          cp lineagelens-scripts/quickstart-lite.sh "${BUNDLE}/quickstart.sh"
          cp lineagelens-scripts/reset-lite.sh      "${BUNDLE}/reset.sh"
          cp lineagelens-scripts/commands-lite.md   "${BUNDLE}/COMMANDS.md"
          chmod +x "${BUNDLE}/quickstart.sh" "${BUNDLE}/reset.sh"

          (cd "${TMPDIR}" && zip -r \
            "${GITHUB_WORKSPACE}/lineagelens-releases/lite/lineagelens-lite-${VERSION}.zip" \
            "lineagelens-lite-${VERSION}")

      # ── Plus bundle ────────────────────────────────────────────────────
      - name: Bundle Plus
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TMPDIR="$(mktemp -d)"
          BUNDLE="${TMPDIR}/lineagelens-plus-${VERSION}"
          mkdir -p "${BUNDLE}/lineagelens-backend" \
                   "${BUNDLE}/lineagelens-proxy" \
                   "${BUNDLE}/lineagelens-deploy" \
                   "${BUNDLE}/lineagelens-scripts" \
                   "${BUNDLE}/lineagelens-docs" \
                   "${BUNDLE}/lineagelens-mcp" \
                   "${BUNDLE}/lineagelens-github-actions"
          mkdir -p lineagelens-releases/plus

          # Backend
          cp -r lineagelens-backend/. "${BUNDLE}/lineagelens-backend/"
          find "${BUNDLE}/lineagelens-backend" -type d -name "__pycache__" -print0 | xargs -0 rm -rf 2>/dev/null || true
          find "${BUNDLE}/lineagelens-backend" -type d -name ".pytest_cache" -print0 | xargs -0 rm -rf 2>/dev/null || true
          find "${BUNDLE}/lineagelens-backend" -name ".env" -delete
          find "${BUNDLE}/lineagelens-backend" -name "*.env" -delete

          # Proxy
          cp -r lineagelens-proxy/. "${BUNDLE}/lineagelens-proxy/"
          find "${BUNDLE}/lineagelens-proxy" -type d -name "__pycache__" -print0 | xargs -0 rm -rf 2>/dev/null || true

          # MCP server
          cp -r lineagelens-mcp/. "${BUNDLE}/lineagelens-mcp/"
          find "${BUNDLE}/lineagelens-mcp" -type d -name "__pycache__" -print0 | xargs -0 rm -rf 2>/dev/null || true

          # Deploy
          cp lineagelens-deploy/docker-compose.plus.yml "${BUNDLE}/lineagelens-deploy/"
          cp lineagelens-deploy/.env.plus.example       "${BUNDLE}/lineagelens-deploy/.env.example"

          # Docs
          cp lineagelens-docs/native-backend.md       "${BUNDLE}/lineagelens-docs/"
          cp lineagelens-docs/architecture.md         "${BUNDLE}/lineagelens-docs/"
          cp lineagelens-docs/shipping-modes.md       "${BUNDLE}/lineagelens-docs/"
          cp lineagelens-docs/lightweight-adapters.md "${BUNDLE}/lineagelens-docs/"

          # GitHub Actions workflows (user drops into their own .github/workflows/)
          cp .github/workflows/lineagelens-annotate.yml  "${BUNDLE}/lineagelens-github-actions/"
          cp .github/workflows/lineagelens-risk-check.yml "${BUNDLE}/lineagelens-github-actions/"
          cp .github/workflows/pr-policy-check.yml       "${BUNDLE}/lineagelens-github-actions/"
          cp .github/workflows/provenance-review.yml     "${BUNDLE}/lineagelens-github-actions/"

          # README and scripts
          cp README.md                                      "${BUNDLE}/README.md"
          cp lineagelens-scripts/run-backend-native.ps1    "${BUNDLE}/lineagelens-scripts/"
          cp lineagelens-scripts/test-backend-native.ps1   "${BUNDLE}/lineagelens-scripts/"
          cp lineagelens-scripts/debug.sh                  "${BUNDLE}/debug.sh"
          cp lineagelens-scripts/debug.ps1                 "${BUNDLE}/debug.ps1"
          cp lineagelens-scripts/quickstart-plus.sh        "${BUNDLE}/quickstart.sh"
          cp lineagelens-scripts/reset-plus.sh             "${BUNDLE}/reset.sh"
          cp lineagelens-scripts/commands-plus.md          "${BUNDLE}/COMMANDS.md"
          chmod +x "${BUNDLE}/quickstart.sh" "${BUNDLE}/reset.sh" "${BUNDLE}/debug.sh"

          (cd "${TMPDIR}" && zip -r \
            "${GITHUB_WORKSPACE}/lineagelens-releases/plus/lineagelens-plus-${VERSION}.zip" \
            "lineagelens-plus-${VERSION}")

      # ── Max bundle ─────────────────────────────────────────────────────
      - name: Bundle Max
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TMPDIR="$(mktemp -d)"
          BUNDLE="${TMPDIR}/lineagelens-max-${VERSION}"
          mkdir -p "${BUNDLE}/lineagelens-backend" \
                   "${BUNDLE}/lineagelens-proxy" \
                   "${BUNDLE}/lineagelens-deploy" \
                   "${BUNDLE}/lineagelens-scripts" \
                   "${BUNDLE}/lineagelens-docs" \
                   "${BUNDLE}/lineagelens-mcp" \
                   "${BUNDLE}/lineagelens-github-actions"
          mkdir -p lineagelens-releases/max

          # Backend
          cp -r lineagelens-backend/. "${BUNDLE}/lineagelens-backend/"
          find "${BUNDLE}/lineagelens-backend" -type d -name "__pycache__" -print0 | xargs -0 rm -rf 2>/dev/null || true
          find "${BUNDLE}/lineagelens-backend" -type d -name ".pytest_cache" -print0 | xargs -0 rm -rf 2>/dev/null || true
          find "${BUNDLE}/lineagelens-backend" -name ".env" -delete
          find "${BUNDLE}/lineagelens-backend" -name "*.env" -delete

          # Proxy
          cp -r lineagelens-proxy/. "${BUNDLE}/lineagelens-proxy/"
          find "${BUNDLE}/lineagelens-proxy" -type d -name "__pycache__" -print0 | xargs -0 rm -rf 2>/dev/null || true

          # MCP server
          cp -r lineagelens-mcp/. "${BUNDLE}/lineagelens-mcp/"
          find "${BUNDLE}/lineagelens-mcp" -type d -name "__pycache__" -print0 | xargs -0 rm -rf 2>/dev/null || true

          # Deploy
          cp lineagelens-deploy/docker-compose.max.yml "${BUNDLE}/lineagelens-deploy/"
          cp lineagelens-deploy/.env.max.example       "${BUNDLE}/lineagelens-deploy/.env.example"

          # Docs
          cp lineagelens-docs/native-backend.md       "${BUNDLE}/lineagelens-docs/"
          cp lineagelens-docs/architecture.md         "${BUNDLE}/lineagelens-docs/"
          cp lineagelens-docs/shipping-modes.md       "${BUNDLE}/lineagelens-docs/"
          cp lineagelens-docs/lightweight-adapters.md "${BUNDLE}/lineagelens-docs/"

          # GitHub Actions workflows (user drops into their own .github/workflows/)
          cp .github/workflows/lineagelens-annotate.yml   "${BUNDLE}/lineagelens-github-actions/"
          cp .github/workflows/lineagelens-risk-check.yml "${BUNDLE}/lineagelens-github-actions/"
          cp .github/workflows/pr-policy-check.yml        "${BUNDLE}/lineagelens-github-actions/"
          cp .github/workflows/provenance-review.yml      "${BUNDLE}/lineagelens-github-actions/"

          # README and scripts
          cp README.md                                     "${BUNDLE}/README.md"
          cp lineagelens-scripts/run-backend-native.ps1   "${BUNDLE}/lineagelens-scripts/"
          cp lineagelens-scripts/test-backend-native.ps1  "${BUNDLE}/lineagelens-scripts/"
          cp lineagelens-scripts/debug.sh                 "${BUNDLE}/debug.sh"
          cp lineagelens-scripts/debug.ps1                "${BUNDLE}/debug.ps1"
          cp lineagelens-scripts/quickstart-max.sh        "${BUNDLE}/quickstart.sh"
          cp lineagelens-scripts/reset-max.sh             "${BUNDLE}/reset.sh"
          cp lineagelens-scripts/commands-max.md          "${BUNDLE}/COMMANDS.md"
          chmod +x "${BUNDLE}/quickstart.sh" "${BUNDLE}/reset.sh" "${BUNDLE}/debug.sh"

          (cd "${TMPDIR}" && zip -r \
            "${GITHUB_WORKSPACE}/lineagelens-releases/max/lineagelens-max-${VERSION}.zip" \
            "lineagelens-max-${VERSION}")

      # ── Standalone offline verifier (PART 5 #52) ───────────────────────
      - name: Package standalone verifier source
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p lineagelens-releases/verifier
          # Plain source zip — reproducible via `pip install .` + a checksum of
          # the sdist. A frozen single-binary build is a documented follow-up
          # (see lineagelens-verifier/README.md); this is the real, working
          # artifact, not a placeholder.
          zip -r "lineagelens-releases/verifier/lineagelens-verifier-${VERSION}.zip" \
            lineagelens-verifier \
            -x 'lineagelens-verifier/*.egg-info/*' \
            -x '*__pycache__*' \
            -x '*.pytest_cache*'

      # ── Python wheelhouse (PART 5 #59) ─────────────────────────────────
      # Previously documented in OFFLINE_INSTALL.md as a manual step; now an
      # actual release artifact so an air-gapped install doesn't depend on an
      # operator running it correctly by hand.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python wheelhouse
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p /tmp/wheelhouse
          pip download -r lineagelens-backend/requirements.txt -d /tmp/wheelhouse
          mkdir -p lineagelens-releases/wheelhouse
          (cd /tmp && zip -r "${GITHUB_WORKSPACE}/lineagelens-releases/wheelhouse/lineagelens-wheelhouse-${VERSION}.zip" wheelhouse)

      # ── Release key registry export (PART 5 #57/#59) ───────────────────
      # Optional: requires DATABASE_URL pointed at the production key registry.
      # If not configured, the script prints why and exits 0 — the asset is
      # skipped with an explanation, never silently omitted (PART 5 #58).
      - name: Export release key registry
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          pip install -r lineagelens-backend/requirements.txt -q
          python lineagelens-scripts/export_key_registry.py \
            --out "lineagelens-releases/lineagelens-release-keys-${VERSION}.json" || true

      # ── Supply-chain: checksums, SBOM, provenance (PART 3 #22, PART 5 #59) ─
      - name: Generate SHA-256 checksums
        run: |
          cd lineagelens-releases
          # Relative paths so the published SHA256SUMS.txt verifies with a plain
          #   `sha256sum -c SHA256SUMS.txt` from the download directory layout.
          find . -type f \( -name '*.vsix' -o -name '*.zip' -o -name '*.json' \) | sort \
            | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: lineagelens-releases/lineagelens-sbom-${{ steps.version.outputs.VERSION }}.spdx.json
          artifact-name: lineagelens-sbom-${{ steps.version.outputs.VERSION }}.spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: lineagelens-releases/lineagelens-sbom-${{ steps.version.outputs.VERSION }}.cdx.json
          artifact-name: lineagelens-sbom-${{ steps.version.outputs.VERSION }}.cdx.json

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            lineagelens-releases/base/*.vsix
            lineagelens-releases/lite/*.zip
            lineagelens-releases/plus/*.zip
            lineagelens-releases/max/*.zip
            lineagelens-releases/verifier/*.zip
            lineagelens-releases/wheelhouse/*.zip

      # ── Scoped follow-ups (not built here — see OFFLINE_INSTALL.md) ────
      # Signed VSIX:            needs a code-signing certificate a solo
      #                         developer doesn't have yet.
      # Pinned image digests:   compose files reference floating tags today,
      #                         not `@sha256:<digest>`, in this workflow.
      # Vendored npm packages:  needs a per-package licensing review before
      #                         vendoring; `npm ci` + lockfile is the current
      #                         mitigation.

      # ── GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Delete any existing release for this tag (e.g. created manually)
          # so CI artifacts are always the canonical published build.
          gh release delete "v${VERSION}" --yes 2>/dev/null || true

          ASSETS=(
            "lineagelens-releases/base/lineagelens-base-${VERSION}.vsix#Base VS Code Extension (.vsix)"
            "lineagelens-releases/lite/lineagelens-lite-${VERSION}.zip#Lite Bundle — SQLite, single container (.zip)"
            "lineagelens-releases/plus/lineagelens-plus-${VERSION}.zip#Plus Bundle — PostgreSQL, full governance (.zip)"
            "lineagelens-releases/max/lineagelens-max-${VERSION}.zip#Max Bundle — PostgreSQL + Neo4j, graph lineage (.zip)"
            "lineagelens-releases/verifier/lineagelens-verifier-${VERSION}.zip#Standalone offline Evidence Capsule verifier (.zip)"
            "lineagelens-releases/wheelhouse/lineagelens-wheelhouse-${VERSION}.zip#Python wheelhouse — offline pip install (.zip)"
            "lineagelens-releases/SHA256SUMS.txt#SHA-256 checksums"
            "lineagelens-releases/lineagelens-sbom-${VERSION}.spdx.json#SPDX SBOM"
            "lineagelens-releases/lineagelens-sbom-${VERSION}.cdx.json#CycloneDX SBOM"
          )
          # Release key registry export is optional (DATABASE_URL-gated) —
          # only attach it if the earlier step actually produced it.
          if [ -f "lineagelens-releases/lineagelens-release-keys-${VERSION}.json" ]; then
            ASSETS+=("lineagelens-releases/lineagelens-release-keys-${VERSION}.json#Release attestation key registry export")
          fi

          gh release create "v${VERSION}" \
            --title "LineageLens v${VERSION}" \
            --generate-notes \
            "${ASSETS[@]}"

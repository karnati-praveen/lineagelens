name: LineageLens PR Annotation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  annotate:
    name: Annotate PR with AI Lineage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          echo "files=$(cat changed_files.txt | tr '\n' ',' | sed 's/,$//')" >> "$GITHUB_OUTPUT"

      - name: Fetch LineageLens annotations
        id: fetch-lineage
        env:
          LINEAGELENS_API_URL: ${{ vars.LINEAGELENS_API_URL }}
          LINEAGELENS_TOKEN: ${{ secrets.LINEAGELENS_TOKEN }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: node .github/scripts/lineagelens-annotate.mjs

      - name: Post PR comment
        if: env.LINEAGELENS_COMMENT != ''
        uses: actions/github-script@v7
        env:
          LINEAGELENS_COMMENT: ${{ env.LINEAGELENS_COMMENT }}
        with:
          script: |
            const body = process.env.LINEAGELENS_COMMENT;
            if (!body) return;

            // Delete previous LineageLens bot comments to avoid duplicates
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            for (const c of comments.data) {
              if (c.body && c.body.includes('<!-- lineagelens-annotation -->')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

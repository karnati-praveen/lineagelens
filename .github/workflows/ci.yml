name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  extension:
    name: Extension Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # --ignore-scripts skips native addon compilation (tree-sitter) which
        # is not needed for typecheck or esbuild bundling
        run: npm ci --ignore-scripts

      - name: Lint and typecheck
        run: npm run lint

      - name: Run extension tests
        # Tests that exercise tree-sitter at runtime may be skipped by tsx when
        # the native binary is absent; mark continue-on-error so the build step
        # always runs
        run: npm run test
        continue-on-error: true

      - name: Compile extension bundle
        run: npm run compile

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineagelens-vsix
          path: "*.vsix"

  backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lineagelens-backend
    env:
      APP_ENV: test
      BACKEND_MODE: team
      NEO4J_ENABLED: "false"
      VECTOR_SEARCH_ENABLED: "false"
      LINEAGE_STRICT_MODE: "false"
      BACKEND_CORS_ORIGINS: http://localhost:3000
      # SQLite for CI — no Postgres service or Alembic migrations needed
      DATABASE_URL: sqlite+aiosqlite:///./data/test.db
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate ephemeral test JWT secrets
        run: |
          echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Run backend tests
        run: pytest tests -q

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  extension:
    name: Extension Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Run extension tests
        run: npm run test

      - name: Compile extension bundle
        run: npm run compile

      - name: Package VSIX
        run: npm run package:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineagelens-vsix
          path: "*.vsix"

  backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: provenance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d provenance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      BACKEND_MODE: team
      NEO4J_ENABLED: "false"
      VECTOR_SEARCH_ENABLED: "false"
      LINEAGE_STRICT_MODE: "false"
      BACKEND_CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/provenance_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate ephemeral test JWT secrets
        run: |
          echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: pytest tests -q

version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: lineagelens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: provenance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d provenance"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/lineagelens/backend:base
    container_name: lineagelens-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_MODE: base
      NEO4J_ENABLED: "false"
      VECTOR_SEARCH_ENABLED: "false"
      APP_ENV: production
      APP_TITLE: LineageLens Base
      APP_VERSION: 0.0.3
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/provenance
      DB_POOL_SIZE: 3
      DB_MAX_OVERFLOW: 5
      DB_POOL_TIMEOUT_SECONDS: 30
      DB_POOL_RECYCLE_SECONDS: 1800
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:?Set JWT_REFRESH_SECRET_KEY in .env}
      JWT_ALGORITHM: HS256
      JWT_AUDIENCE: provenance-api
      JWT_ISSUER: provenance-backend
      JWT_ACCESS_TOKEN_TTL_MINUTES: 30
      JWT_REFRESH_TOKEN_TTL_MINUTES: 10080
      JWT_REQUIRED_SCOPES: provenance:write provenance:read
      AUTH_PASSWORD_MIN_LENGTH: 8
      BACKEND_CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      HTTP_MAX_BODY_BYTES: 1000000
      WS_MAX_MESSAGE_BYTES: 1000000
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_MAX_REQUESTS: 60
      RATE_LIMIT_WS_MAX_CONNECTIONS: 5
    ports:
      - "8787:8787"

volumes:
  postgres_data:

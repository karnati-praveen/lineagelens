apiVersion: apps/v1
kind: Deployment
metadata:
  name: lineagelens-backend
  namespace: lineagelens
  labels:
    app: lineagelens-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lineagelens-backend
  template:
    metadata:
      labels:
        app: lineagelens-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: lineagelens/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8787
              name: http
          envFrom:
            - configMapRef:
                name: lineagelens-config
            - secretRef:
                name: lineagelens-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lineagelens.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lineagelens.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey is required" .Values.secrets.jwtSecretKey | quote }}
  JWT_REFRESH_SECRET_KEY: {{ required "secrets.jwtRefreshSecretKey is required" .Values.secrets.jwtRefreshSecretKey | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  NEO4J_URI: {{ .Values.secrets.neo4jUri | quote }}
  NEO4J_USER: {{ .Values.secrets.neo4jUser | quote }}
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
  EMBEDDING_API_KEY: {{ .Values.secrets.embeddingApiKey | quote }}
  EXPLAIN_LLM_API_KEY: {{ .Values.secrets.explainLlmApiKey | quote }}
  SMTP_HOST: {{ .Values.secrets.smtpHost | quote }}
  SMTP_PORT: {{ .Values.secrets.smtpPort | quote }}
  SMTP_USER: {{ .Values.secrets.smtpUser | quote }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  SMTP_FROM: {{ .Values.secrets.smtpFrom | quote }}

version: "3.9"

# LineageLens Lite — single container, SQLite, zero external dependencies.
# Runs on a $5 VPS or a laptop. No Postgres, no Redis, no Neo4j.
#
# Usage:
#   1. Copy .env.lite.example to .env and fill in JWT_SECRET_KEY
#   2. docker compose -f docker-compose.lite.yml up -d
#   3. Open http://localhost:8787 — setup wizard runs on first visit

services:
  lineagelens:
    build:
      context: ../lineagelens-backend
      dockerfile: Dockerfile
    image: lineagelens/lineagelens:lite
    container_name: lineagelens
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/lineagelens.db
      BACKEND_MODE: solo
      NEO4J_ENABLED: "false"
      VECTOR_SEARCH_ENABLED: "false"
      LINEAGE_STRICT_MODE: "false"
      APP_TITLE: LineageLens
      APP_ENV: production
      EMBEDDING_PROVIDER: hash
      RATE_LIMIT_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8787/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  proxy:
    build:
      context: ../lineagelens-proxy
      dockerfile: Dockerfile
    image: lineagelens/lineagelens-proxy:lite
    container_name: lineagelens-proxy
    restart: unless-stopped
    depends_on:
      - lineagelens
    environment:
      UPSTREAM_URL: ${PROXY_UPSTREAM_URL:-https://api.anthropic.com}
      BACKEND_URL: http://lineagelens:8787
      BACKEND_INGEST_TOKEN: ${PROXY_INGEST_TOKEN:-}
      PROXY_WORKSPACE_ID: ${PROXY_WORKSPACE_ID:-proxy-capture}
      PROXY_PORT: 8788
    ports:
      - "8788:8788"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8788/proxy-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

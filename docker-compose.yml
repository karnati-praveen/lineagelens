version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: provenance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: provenance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d provenance"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: provenance-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1024M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'RETURN 1;' | cypher-shell -a bolt://localhost:7687 -u neo4j -p neo4j_password || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: provenance-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_TITLE: AI Provenance Backend
      APP_VERSION: 0.1.0
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/provenance
      PGVECTOR_DIMENSION: 256
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: neo4j_password
      NEO4J_DATABASE: neo4j
      JWT_SECRET_KEY: change-me
      JWT_REFRESH_SECRET_KEY: change-me-refresh
      JWT_ALGORITHM: HS256
      JWT_AUDIENCE: provenance-api
      JWT_ISSUER: provenance-backend
      JWT_ACCESS_TOKEN_TTL_MINUTES: 30
      JWT_REFRESH_TOKEN_TTL_MINUTES: 10080
      JWT_REQUIRED_SCOPES: provenance:write provenance:read
      AUTH_PASSWORD_MIN_LENGTH: 8
      BACKEND_CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_WINDOW_SECONDS: 60
      RATE_LIMIT_MAX_REQUESTS: 120
      RATE_LIMIT_WS_WINDOW_SECONDS: 60
      RATE_LIMIT_WS_MAX_MESSAGES: 120
      RATE_LIMIT_WS_MAX_CONNECTIONS: 30
      RATE_LIMIT_MAX_TRACKED_KEYS: 50000
      EXPLAIN_LLM_API_URL: https://api.openai.com/v1/chat/completions
      EXPLAIN_LLM_API_KEY: ""
      EXPLAIN_LLM_MODEL: gpt-4o-mini
      EXPLAIN_LLM_TIMEOUT_SECONDS: 25
    ports:
      - "8787:8787"

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
